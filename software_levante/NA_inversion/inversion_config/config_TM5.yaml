# config file for inversion run

# define time range of measurements
start_date: "2019-10-01"
end_date: "2023-03-31"

output_dir: "/work/bb1170/RUN/b383736/data/Flexpart_2021/Flexpart/"

prior_flux_dir: '/work/bb1170/RUN/b383736/data/Flexpart_2021/TM54DVar/TM54DVar_fluxes_3years/'
res_list: [2]       # spatial resolution in °, eg 2 for 2x2°
corr_list: ['with' ]  # 'with','no', 'temporal', 'spatial', 'temporal_1M', 'with_1M', 'with_e04' correlation

# list of measurement errors
gosat_meas_err_list: [2]
insitu_meas_err_list: [3]

# list of footprints
f_list: ['spec001_mr']   # 'spec001_mr' for unscaled footprints

footprints_subdirectory: "/prep_footprints_TM5_3_years_flexpart_region/diurnal_amplitude_weekly/"    # subdirectory in output_dir/insitu or output_dir/RemoTeCv240 directory where weekly footprint files are saved
